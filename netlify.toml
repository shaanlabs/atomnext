[build]
  functions = "netlify/functions"
  publish = "."

[build.environment]
  NODE_VERSION = "18"

# ==============================================================================
# Security Redirects & File Access Protection
# ==============================================================================

# Protect secret files, python scripts, configuration, and dependencies from public web browsing
[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.py"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.json"
  to = "/404.html"
  status = 404
  force = true

# Route API requests to Serverless Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ==============================================================================
# Global Enterprise HTTP Security Headers
# ==============================================================================
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent Clickjacking
    X-Frame-Options = "SAMEORIGIN"
    
    # Prevent MIME Sniffing
    X-Content-Type-Options = "nosniff"
    
    # Legacy XSS Filter protection
    X-XSS-Protection = "1; mode=block"
    
    # Prevent leaking sensitive referral data
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Restrict device and browser APIs
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    
    # HTTP Strict Transport Security (HSTS)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
    # Content Security Policy (CSP)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self';"
